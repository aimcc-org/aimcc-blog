server {
    listen 80;

    # 不用绑定具体 IP / 域名：容器里的 nginx 只服务这一个站点，
    # 写 _ 表示「不管请求里的 Host 是什么都接」
    server_name _;

    # 静态文件的位置：容器内路径。
    # 这些文件是 Dockerfile 里 COPY 进镜像的，不是宿主机目录
    root /usr/share/nginx/html;
    index index.html;

    # 普通页面：先找同名文件，再找同名目录，都没有就回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口请求转给后端容器：
    #   原来写的是 127.0.0.1:8080（宿主机上的 java 进程）
    #   现在改成 server:8080 —— server 就是 compose 里的后端服务名，
    #   容器网络内部能直接解析，不需要知道它的 IP
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
