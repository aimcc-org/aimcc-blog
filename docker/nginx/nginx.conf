server {
    listen 80;

    # 不用绑定具体 IP / 域名：容器里的 nginx 只服务这一个站点，
    # 写 _ 表示「不管请求里的 Host 是什么都接」
    server_name _;

    # Docker 内置 DNS。后端有多个副本时，server 这个名字会解析出多个 IP，
    # 这里让 nginx 自己去问 DNS，并且 10 秒刷新一次（副本增减能被感知到）
    # 注意：不写这行，nginx 只在启动时解析一次，之后永远只打同一个副本
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静态文件的位置：容器内路径。
    # 这些文件是 Dockerfile 里 COPY 进镜像的，不是宿主机目录
    root /usr/share/nginx/html;
    index index.html;

    # 普通页面：先找同名文件，再找同名目录，都没有就回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台（React SPA，打包产物在 /usr/share/nginx/html/admin）
    # 和博客的区别：后台是前端路由，/admin/articles 这种地址在磁盘上没有对应文件，
    # 所以找不到文件时统一回退到 /admin/index.html，由 React 自己处理路由
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 访问 /admin（不带斜杠）时补一个斜杠，
    # 否则相对路径（assets/xxx.js）会拼错位置，页面一片空白
    location = /admin {
        return 301 /admin/;
    }

    # 接口请求转给后端容器：
    #   server 是 compose 里的后端服务名，容器网络内部能直接解析
    # 两个要点：
    #   ① 用变量 $backend 而不是直接写域名 —— 直接写域名时 nginx 只在启动时解析一次，
    #      多副本时只会打到一个实例；用变量才会每次按 resolver 的结果分发（多个 IP 轮询）
    #   ② proxy_pass 用变量时不能再带 URI 后缀，正好后端 context-path 是 /api，
    #      原样转发 /api/xxx 就是对的
    location /api/ {
        set $backend "http://server:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 响应头里带上真正处理请求的后端地址（IP:端口），
        # curl -i 就能看出这次落到哪个副本，排查多实例问题时非常有用
        add_header X-Upstream $upstream_addr always;
    }
}
