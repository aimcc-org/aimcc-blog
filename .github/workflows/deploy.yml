name: Deploy to Server

on:
  push:
    branches: [main]

# 工作流级别的环境变量，下面每个 step 都能用
env:
  # 后端每个可运行模块各一个 ACR 仓库（不含 :tag），构建和推送都要拼它
  # 拆成多个仓库而不是一个镜像多个 tag：各服务可以独立发布、独立回滚
  # migration 是一次性迁移任务，跑完即退；eureka 是注册中心，常驻但不转发流量
  IMAGE_GATEWAY: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-gateway
  IMAGE_PUBLIC: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-public
  IMAGE_ADMIN: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-admin
  IMAGE_MIGRATION: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-migration
  # 注册中心：Eureka Server，保存服务名单，不参与请求转发
  IMAGE_EUREKA: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-eureka
  # 前端镜像：nginx + 打进镜像的静态文件
  FRONT_IMAGE: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-nginx

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v7

      # ============================================================
      # 后端：先打 jar，再打成 Docker 镜像，最后推到阿里云 ACR
      # ============================================================

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build backend jar
        working-directory: server
        run: mvn clean package -DskipTests

      # 登录 ACR：registry 只写域名，不能带 https://
      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 构建镜像
      # - runner 本身是 x86_64，所以不用写 --platform（本机 Mac 才需要）
      # - 构建上下文是 ./server，Dockerfile 在 docker/server/ 下，用 -f 指定
      # - 一个 Dockerfile 打三个模块，靠 --build-arg MODULE 区分要拷哪个 jar
      # - 每个镜像打两个标签：latest 给自动部署用，sha 留给以后回滚用
      - name: Build backend images
        run: |
          set -e
          build_image() {
            module=$1
            image=$2
            docker build \
              -f docker/server/Dockerfile \
              --build-arg MODULE=$module \
              -t $image:latest \
              -t $image:${{ github.sha }} \
              ./server
          }
          build_image blog-gateway "$IMAGE_GATEWAY"
          build_image blog-public-service "$IMAGE_PUBLIC"
          build_image blog-admin-service "$IMAGE_ADMIN"
          # 迁移镜像体积很小（只有 Flyway + 驱动 + SQL），但它必须比业务镜像先跑
          build_image blog-migration "$IMAGE_MIGRATION"
          # 注册中心：网关和业务服务都依赖它，必须先于它们启动
          build_image blog-eureka "$IMAGE_EUREKA"

      # 跨境推送到阿里云 ACR 时，单个大层（基础镜像约 170MB）容易在传输中被掐断，
      # 报 "use of closed network connection"。docker push 已成功上传的层会被跳过，
      # 所以失败后重试相当于断点续传，代价很低。
      - name: Push backend images
        run: |
          set -e
          push_with_retry() {
            image="$1"
            tag="$2"
            attempt=1
            while [ "$attempt" -le 5 ]; do
              echo "推送 ${image}:${tag}（第 ${attempt} 次）"
              if docker push "${image}:${tag}"; then
                return 0
              fi
              echo "::warning::推送 ${image}:${tag} 失败，20 秒后重试"
              attempt=$((attempt + 1))
              sleep 20
            done
            echo "::error::推送 ${image}:${tag} 连续 5 次失败"
            return 1
          }
          for image in "$IMAGE_GATEWAY" "$IMAGE_PUBLIC" "$IMAGE_ADMIN" "$IMAGE_MIGRATION" "$IMAGE_EUREKA"; do
            push_with_retry "$image" latest
            push_with_retry "$image" "${GITHUB_SHA}"
          done

      # ============================================================
      # 前端：先 pnpm build 产出 dist/main，再打成 nginx 镜像
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.4

      - name: Build frontend
        working-directory: front
        run: |
          pnpm install:all
          cd blog-web
          pnpm build

      # 构建管理后台（React SPA）
      # 和 blog-web 一样产出静态文件，最后由同一个 nginx 镜像托管
      # 多一层 check-architecture + tsc 类型检查，失败会直接中断部署
      - name: Build admin
        working-directory: front/blog-admin
        run: pnpm build

      # 构建前端镜像
      # - 必须排在 Build frontend / Build admin 之后：
      #   Dockerfile 里 COPY 的两个 dist 这时才存在
      # - 上下文是仓库根（Dockerfile 要同时拿 docker/nginx/nginx.conf 和两个 dist）
      # - .dockerignore 白名单已经把无关文件挡在上下文之外
      - name: Build frontend image
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t $FRONT_IMAGE:latest \
            -t $FRONT_IMAGE:${{ github.sha }} \
            .

      - name: Push frontend image
        run: |
          set -e
          push_with_retry() {
            tag="$1"
            attempt=1
            while [ "$attempt" -le 5 ]; do
              echo "推送 ${FRONT_IMAGE}:${tag}（第 ${attempt} 次）"
              if docker push "${FRONT_IMAGE}:${tag}"; then
                return 0
              fi
              echo "::warning::推送 ${FRONT_IMAGE}:${tag} 失败，20 秒后重试"
              attempt=$((attempt + 1))
              sleep 20
            done
            echo "::error::推送 ${FRONT_IMAGE}:${tag} 连续 5 次失败"
            return 1
          }
          push_with_retry latest
          push_with_retry "${GITHUB_SHA}"

      # ============================================================
      # 部署到服务器
      # ============================================================

      # 两台机器的私钥一起交给 ssh-agent，和 A 机的处理方式完全一致
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            ${{ secrets.B_SSH_PRIVATE_KEY }}

      - name: Add servers to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.B_SERVER_IP }} >> ~/.ssh/known_hosts

      # 同步 compose 配置：让服务器上的 /opt/blog-compose/docker-compose.yml
      # 永远等于仓库里的 deploy/compose-main.yml，避免手工改服务器造成配置漂移
      # 服务器上必须落成默认文件名 docker-compose.yml，否则 `docker compose up`
      # 找不到文件；仓库里之所以另起名，是为了和本地那份、B 机那份区分开
      # 顺序是「先传临时文件 → 备份旧的 → 替换 → 校验语法」，
      # 任何一步失败都不会破坏正在运行的那份配置
      - name: Sync compose file
        run: |
          scp deploy/compose-main.yml root@${{ secrets.SERVER_IP }}:/opt/blog-compose/docker-compose.yml.new
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/blog-compose && cp docker-compose.yml docker-compose.yml.bak && mv docker-compose.yml.new docker-compose.yml && docker compose config -q && echo 'compose 配置校验通过'"

      # 后端部署：让服务器从 ACR 拉最新镜像，然后重建后端服务
      # - pull / up 都显式点名 eureka gateway public admin：mysql / redis / nginx 不动
      # - eureka 必须带上：它的镜像是新仓库，不拉就起不来
      # - --remove-orphans 清掉改名前的旧 server 容器（服务名从 server 拆成三个后
      #   旧容器就是「孤儿」，留着会占端口和内存）
      # - 顺序有依赖：gateway 依赖 public / admin 先起来，compose 会按 depends_on 排
      - name: Deploy backend
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/blog-compose && docker compose pull migration eureka gateway public admin && docker compose up -d --remove-orphans eureka gateway public admin"

      # ============================================================
      # B 机（北京轻量）：只跑一个 public 副本
      # ============================================================
      # 位置放在 A 机后端之后：先让 A 的新版本和网关就绪，再让 B 跟上，
      # 避免出现「B 已跑新代码、A 还没发版」的中间态
      # 注意：CI 不执行数据库迁移，表结构变更仍需在 A 机上手动跑 migration 容器；
      #      B 机的 public 用的是 A 机的库，所以表没就绪时 B 会先挂掉
      - name: Sync worker compose
        run: |
          scp deploy/compose-worker.yml root@${{ secrets.B_SERVER_IP }}:/opt/blog-worker/docker-compose.yml.new
          ssh root@${{ secrets.B_SERVER_IP }} "cd /opt/blog-worker && cp docker-compose.yml docker-compose.yml.bak && mv docker-compose.yml.new docker-compose.yml && docker compose config -q && echo 'B compose 校验通过'"

      # B 机的 ACR 登录态存在 /root/.docker/config.json，但密码一旦变更就会失效，
      # 所以每次部署都重新登录一次；密码走 stdin，不出现在远端 ps 里
      - name: Login to ACR on worker
        run: |
          printf '%s' "${{ secrets.ACR_PASSWORD }}" | ssh root@${{ secrets.B_SERVER_IP }} "docker login crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com -u ${{ secrets.ACR_USERNAME }} --password-stdin"

      - name: Deploy worker
        run: |
          ssh root@${{ secrets.B_SERVER_IP }} "cd /opt/blog-worker && docker compose pull public && docker compose up -d public"

      # 部署后验一次真实健康：health 里含 db / redis 检查，
      # 能挡住「跨公网数据源配错」这类只在运行时才暴露的问题
      - name: Verify worker
        run: |
          ssh root@${{ secrets.B_SERVER_IP }} "curl -sf --max-time 10 http://127.0.0.1:8081/api/actuator/health >/dev/null && echo 'B 机 public 健康'"

      # 前端部署：不再 scp 静态文件，改成「拉新镜像 + 重建 nginx 容器」
      # - 静态文件已经打进镜像里，服务器上不再需要 /var/www/blog
      # - docker compose pull nginx  只拉 nginx 这一个服务的新镜像
      # - docker compose up -d nginx 只重建 nginx，mysql / redis / server 不动
      - name: Deploy frontend
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/blog-compose && docker compose pull nginx && docker compose up -d nginx"
