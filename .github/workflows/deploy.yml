name: Deploy to Server

on:
  push:
    branches: [main]

# 工作流级别的环境变量，下面每个 step 都能用
env:
  # ACR 仓库地址（不含 :tag），构建和推送都要拼它
  IMAGE: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-server
  # 前端镜像：nginx + 打进镜像的静态文件
  FRONT_IMAGE: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-nginx

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 后端：先打 jar，再打成 Docker 镜像，最后推到阿里云 ACR
      # ============================================================

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build backend jar
        working-directory: server
        run: mvn clean package -DskipTests

      # 登录 ACR：registry 只写域名，不能带 https://
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 构建镜像
      # - runner 本身是 x86_64，所以不用写 --platform（本机 Mac 才需要）
      # - 构建上下文是 ./server，Dockerfile 在 docker/server/ 下，用 -f 指定
      # - Dockerfile 里 COPY target/xxx.jar 是相对上下文（server/）算的
      # - 打两个标签：latest 给自动部署用，sha 留给以后回滚用
      - name: Build server image
        run: |
          docker build \
            -f docker/server/Dockerfile \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            ./server

      - name: Push server image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      # ============================================================
      # 前端：先 pnpm build 产出 dist/main，再打成 nginx 镜像
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Build frontend
        working-directory: front
        run: |
          pnpm install:all
          cd blog-web
          pnpm build

      # 构建前端镜像
      # - 必须排在 Build frontend 之后：Dockerfile 里 COPY 的 dist/main 这时才存在
      # - 上下文是仓库根（Dockerfile 要同时拿 docker/nginx/nginx.conf 和 dist/main）
      # - .dockerignore 白名单已经把无关文件挡在上下文之外
      - name: Build frontend image
        run: |
          docker build \
            -f docker/nginx/Dockerfile \
            -t $FRONT_IMAGE:latest \
            -t $FRONT_IMAGE:${{ github.sha }} \
            .

      - name: Push frontend image
        run: |
          docker push $FRONT_IMAGE:latest
          docker push $FRONT_IMAGE:${{ github.sha }}

      # ============================================================
      # 部署到服务器
      # ============================================================

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 后端部署：不再传 jar、不再重启 systemd 服务
      # 改成「让服务器从 ACR 拉最新镜像，然后重建 server 容器」
      # - docker compose pull server   只拉 server 这一个服务的新镜像
      # - docker compose up -d server  只重建 server，mysql / redis 不动
      - name: Deploy backend
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/blog-compose && docker compose pull server && docker compose up -d server"

      # 前端部署：不再 scp 静态文件，改成「拉新镜像 + 重建 nginx 容器」
      # - 静态文件已经打进镜像里，服务器上不再需要 /var/www/blog
      # - docker compose pull nginx  只拉 nginx 这一个服务的新镜像
      # - docker compose up -d nginx 只重建 nginx，mysql / redis / server 不动
      - name: Deploy frontend
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /opt/blog-compose && docker compose pull nginx && docker compose up -d nginx"
