name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 后端打包：JDK 25 + Maven
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build backend jar
        working-directory: server
        run: mvn clean package -DskipTests

      # 3. 前端打包：Node + pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Build frontend
        working-directory: front
        run: |
          pnpm install:all
          pnpm build

      # 4. 配置 SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 5. 上传后端 jar 并重启服务
      - name: Deploy backend
        run: |
          scp server/target/server-0.0.1-SNAPSHOT.jar root@${{ secrets.SERVER_IP }}:/opt/blog/blog.jar
          ssh root@${{ secrets.SERVER_IP }} "systemctl restart blog"

      # 6. 上传前端静态文件
      - name: Deploy frontend
        run: |
          ssh root@${{ secrets.SERVER_IP }} "rm -rf /var/www/blog/*"
          scp -r front/blog-web/dist/main/* root@${{ secrets.SERVER_IP }}:/var/www/blog/
          ssh root@${{ secrets.SERVER_IP }} "chown -R www-data:www-data /var/www/blog"
