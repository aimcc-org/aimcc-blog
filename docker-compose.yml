# ============================================================
# docker-compose.yml —— 一条命令把 mysql / redis / server 三个容器起全
#
# 用法（在本文件所在目录执行）：
#   docker compose up -d      启动全部（-d 后台运行）
#   docker compose ps         看状态
#   docker compose logs -f    看日志
#   docker compose down       停掉并删除容器（数据卷保留）
#
# 和手敲 docker run 最大的区别：
#   compose 会自动建一个内部网络，三个容器都在这个网络里，
#   彼此可以直接用「服务名」当主机名访问（mysql / redis），
#   完全不用管 3307、host.docker.internal 这些东西。
# ============================================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: aimcc_blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: root1234
    ports:
      # 仍然映射到宿主机 3307，方便你用 DBeaver 从 Mac 直接连
      # server 容器不走这个端口，它走内部网络直连 mysql:3306
      - "3307:3306"
    volumes:
      # 挂到已有的卷上，之前建好的数据和账号都在里面，不会丢
      - blog-mysql-data:/var/lib/mysql
    healthcheck:
      # 探活：能 ping 通才算「准备好了」
      # 下面 server 会等它 healthy 之后才启动，避免「数据库还没起来应用就连」
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Redis ----------
  redis:
    # 用 8（Debian 底座）而不是 8-alpine：
    #   alpine 体积小，但容器里没有 bash / ps 这些常用命令，排查问题不方便。
    # 本地和服务器统一用 8，保证两边环境一致。
    image: redis:8
    container_name: blog-redis
    # 镜像名后面跟的这段就是覆盖启动命令，给 Redis 加密码
    command: redis-server --requirepass root1234
    ports:
      - "6379:6379"

  # ---------- Spring Boot 应用 ----------
  # 注意：这里故意不写 container_name，也不映射 ports
  #   container_name 写死会让第二个副本撞名（Conflict），--scale 直接失败
  #   固定映射 8080:8080 也只有第一个副本能拿到端口，第二个必然冲突
  # 结论：要能横向扩容的服务，容器名交给 compose 生成（blog-server-1 / blog-server-2），
  #       外部统一从 nginx（80 端口）进来，不直连后端
  server:
    # 镜像定义集中在 docker/server/Dockerfile，monorepo 的部署资产统一放 docker/ 下
    # context 仍然是 server/：jar 就在 server/target 里，上下文越小传得越快
    # dockerfile 路径相对 context 计算，所以用 ../ 回到仓库根
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile
    # 默认起 2 个副本，和生产保持一致（生产同样写 replicas: 2）
    # 写在这里就不必每次 up 都带 --scale server=2；
    # 想临时缩回 1 个：docker compose up -d --scale server=1（命令行参数优先于这里）
    deploy:
      replicas: 2
    environment:
      # 注意这里的主机名：
      #   mysql / redis 就是上面两个服务的名字，compose 内部网络里能直接解析
      #   端口用容器内部的 3306 / 6379，不是宿主机的 3307
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: root1234
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ---------- 前端（Nginx） ----------
  nginx:
    # 部署资产放在仓库根 docker/nginx/ 下（monorepo 里它不属于某个前端包）
    # context 是仓库根目录，Dockerfile 里 COPY 的路径都相对仓库根写
    # 构建前前端必须已经 build 过（front/blog-web/dist/main 存在），否则会报找不到文件
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: blog-nginx
    ports:
      # 宿主机 80 → 容器 80，浏览器直接访问 http://localhost
      - "80:80"
    depends_on:
      server:
        condition: service_started

volumes:
  # 声明用已有的卷（不写 name 的话 compose 会自动加项目名前缀，变成新卷）
  blog-mysql-data:
    name: blog-mysql-data
