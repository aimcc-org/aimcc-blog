# ============================================================
# docker-compose.yml —— 一条命令把「两个中间件 + 三个后端 + 前端」六个容器起全
#
# 用法（在本文件所在目录执行）：
#   docker compose up -d --build   构建镜像并启动全部（-d 后台运行）
#   docker compose ps              看状态
#   docker compose logs -f         看日志
#   docker compose down           停掉并删除容器（数据卷保留）
#   docker compose up -d --remove-orphans   服务改名后清掉旧容器时用
#
# 拓扑（对外只有 nginx 的 80 端口）：
#   浏览器 → nginx:80 → gateway:8080 ┬→ public:8081  (/api/**)
#                                   └→ admin:8082   (/api/admin/**)
# 三个后端都不映射宿主机端口，只能经网关访问
# ============================================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: aimcc_blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: root1234
    ports:
      # 仍然映射到宿主机 3307，方便你用 DBeaver 从 Mac 直接连
      # 后端容器不走这个端口，它走内部网络直连 mysql:3306
      - "3307:3306"
    volumes:
      # 挂到已有的卷上，之前建好的数据和账号都在里面，不会丢
      - blog-mysql-data:/var/lib/mysql
    healthcheck:
      # 探活：能 ping 通才算「准备好了」
      # 三个后端都会等它 healthy 之后才启动，避免「数据库还没起来应用就连」
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Redis ----------
  redis:
    # 用 8（Debian 底座）而不是 8-alpine：
    #   alpine 体积小，但容器里没有 bash / ps 这些常用命令，排查问题不方便。
    # 本地和服务器统一用 8，保证两边环境一致。
    image: redis:8
    container_name: blog-redis
    # 镜像名后面跟的这段就是覆盖启动命令，给 Redis 加密码
    command: redis-server --requirepass root1234
    ports:
      - "6379:6379"
    healthcheck:
      # 能 PONG 才算就绪。redis 起得快，但「容器起来了」和「能接受命令」是两回事
      # --no-auth-warning 只是不打印密码提示，退出码仍然由 PING 的结果决定
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "root1234", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 注册中心：只保存服务名册，不参与请求转发 ----------
  # 网关从这里拉「public 有哪些实例」，然后直连实例 IP：请求流量不经过它。
  # 单独一个进程：网关发版重启不会连带注册中心一起消失。
  eureka:
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile
      args:
        MODULE: blog-eureka
        PORT: 8761
    image: aimcc-blog-eureka:latest
    # 只在本机映射：浏览器打开 http://localhost:8761 就能看到名册页面
    # 生产不映射端口，注册中心只允许容器网络内部访问
    ports:
      - "8761:8761"
    healthcheck:
      # /eureka/apps 返回 200 就说明注册中心能正常应答查询
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ---------- 数据库迁移：一次性任务，跑完即退 ----------
  # 之前迁移是在 admin 启动时执行的，导致 admin 只能单副本、迁移失败就等于服务起不来。
  # 现在拆成独立容器：先迁移，成功后 public / admin 才启动。
  # 这个容器没有 ports、不常驻，成功退出后状态是 Exited (0)，属于正常现象。
  migration:
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile
      args:
        MODULE: blog-migration
        # 迁移任务不监听端口，PORT 只是镜像元信息，随便给个值即可
        PORT: 8080
    # 镜像名与 ACR 仓库名保持一致（去掉 registry 前缀），本地和线上对得上
    image: aimcc-blog-migration:latest
    # 跑完就退出；如果被 restart 策略拉起来，会反复执行迁移
    restart: "no"
    environment:
      # 注意这里是容器内网络：mysql:3306，不是宿主机的 3307
      DB_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- 公开服务：前台博客的只读接口 ----------
  # 不写 container_name、不映射 ports：
  #   container_name 写死会让第二个副本撞名（Conflict），--scale 直接失败
  #   固定映射端口也只有第一个副本能拿到，第二个必然冲突
  public:
    build:
      # jar 在 server/blog-public-service/target 里，上下文仍是 server/
      context: ./server
      dockerfile: ../docker/server/Dockerfile
      args:
        MODULE: blog-public-service
        PORT: 8081
    image: aimcc-blog-public:latest
    # 两个副本：验证 Eureka 名册 + 网关 lb:// 的轮询与故障摘除。
    # 两个容器共享同一个服务名 public，网关不认这个名字——
    # 它只认真实实例的 IP，IP 由 Eureka 提供，所以副本数随便改都能被发现
    deploy:
      replicas: 2
    environment:
      # mysql / redis 就是上面的服务名，compose 内部网络里能直接解析
      # 端口用容器内部的 3306 / 6379，不是宿主机的 3307
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: root1234
      # 注册中心地址（容器内网络，用服务名而不是 localhost）
      EUREKA_URL: "http://eureka:8761/eureka"
    healthcheck:
      # 探 actuator：HTTP 200 才算健康。health 里含 db / redis 检查，
      # 所以这一条同时代表「Spring 上下文起完 + 数据源可连」，而不只是「Java 进程还在」
      # wget 是镜像里自带的 busybox 命令，失败时退出码非 0，compose 只认退出码
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8081/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # JVM 冷启动期间失败不计入 retries，避免启动慢一点就被判死
      start_period: 30s
    depends_on:
      # 注册中心没起来就没有名册，后端地址无从查起
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 迁移必须先跑完且成功（Exited 0），否则不启动：宁可起不来，也不要在半旧的结构上跑
      migration:
        condition: service_completed_successfully

  # ---------- 管理服务：后台写接口 + 登录鉴权 ----------
  admin:
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile
      args:
        MODULE: blog-admin-service
        PORT: 8082
    image: aimcc-blog-admin:latest
    # 迁移已经移出本服务，理论上可以多副本了；
    # 先保持 1，等真正需要扩容时再改，避免一次动太多
    deploy:
      replicas: 1
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: root1234
      # 注册中心地址（容器内网络，用服务名而不是 localhost）
      EUREKA_URL: "http://eureka:8761/eureka"
    healthcheck:
      # 与 public 同理，只是端口和路径前缀不同：8082 + /api
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8082/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      # 注册中心没起来就没有名册，后端地址无从查起
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # ---------- 网关：唯一入口，按路径前缀分流 ----------
  gateway:
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile
      args:
        MODULE: blog-gateway
        PORT: 8080
    image: aimcc-blog-gateway:latest
    # 同上，先 1 个副本；网关虽无状态，但同机多副本只是多占一份内存
    deploy:
      replicas: 1
    environment:
      # 覆盖 application.yaml 里的默认 localhost 地址
      # 后端地址不再写死，网关按 lb://服务名 去这里查实例列表
      EUREKA_URL: "http://eureka:8761/eureka"
    healthcheck:
      # 网关没有 context-path，health 就在根路径上
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      # 注册中心没起来就没有名册，后端地址无从查起
      eureka:
        condition: service_healthy
      public:
        condition: service_healthy
      admin:
        condition: service_healthy

  # ---------- 前端（Nginx） ----------
  nginx:
    # 部署资产放在仓库根 docker/nginx/ 下（monorepo 里它不属于某个前端包）
    # context 是仓库根目录，Dockerfile 里 COPY 的路径都相对仓库根写
    # 构建前前端必须已经 build 过（front/blog-web/dist/main 存在），否则会报找不到文件
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    # 显式写名字，不依赖 compose 按「项目目录名-服务名」自动推导
    image: aimcc-blog-nginx:latest
    container_name: blog-nginx
    ports:
      # 宿主机 80 → 容器 80，浏览器直接访问 http://localhost
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  # 声明用已有的卷（不写 name 的话 compose 会自动加项目名前缀，变成新卷）
  blog-mysql-data:
    name: blog-mysql-data
