# ============================================================
# A 机（阿里云 ECS，杭州）生产编排 —— 入口 + 数据库 + 全栈
#
# 它不是服务器上直接跑的文件：CI 会把它同步到 A 机的
# /opt/blog-compose/docker-compose.yml（改成默认文件名）。
# 之所以在仓库里另起名字，是为了和本地那份、B 机那份区分开。
# ------------------------------------------------------------
# 和本地 docker-compose.yml 的区别：
#   1. 镜像从 ACR 拉，不在服务器上构建（服务器没有源码，也没有 JDK / Node）
#   2. 对外只开四个端口：
#      nginx 80（对全网）、mysql 3306 / redis 6379 / eureka 8761（只对 B 机 IP 放行，
#      门禁在安全组，不在这里）；其余服务只走容器网络
#   3. 全部加 restart: unless-stopped，服务器重启后容器自动拉起
#
# 三个后端的分工：
#   gateway 8080  唯一入口，按路径前缀分流
#   public  8081  /api/** 读接口，可多副本
#   admin   8082  /api/admin/** 写接口 + 登录，只有 1 个副本
#   migration     一次性迁移任务，跑完退出，public / admin 等它成功后才启动
#
# 落地要求：目录必须是 /opt/blog-compose、文件名必须是 docker-compose.yml。
# 项目名取自目录名，数据卷名带项目名前缀；卷名已在文件末尾写死，所以目录改名
# 只会影响容器名前缀，不会挂到空卷上。
# ============================================================
services:
  mysql:
    image: mysql:8
    container_name: blog-mysql
    # 对外开放 3306：B 机（北京轻量）上的 public 副本要跨公网查库
    # 真正的门禁在安全组：只放行 B 机公网 IP，绑定 0.0.0.0 不会直接裸露给全网
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: aimcc_blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: root1234
    volumes:
      - blog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/redis:8
    container_name: blog-redis
    # 对外开放 6379：同 mysql，靠安全组限制来源
    ports:
      - "6379:6379"
    command: redis-server --requirepass root1234
    healthcheck:
      # public / admin 的依赖条件是 service_healthy，被依赖的服务就必须自己配 healthcheck，
      # 否则 compose 在 up 阶段直接报 "has no healthcheck configured" 并终止部署
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "root1234", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  # ---------- 注册中心：保存服务名册，不参与请求转发 ----------
  # +200MB 内存，换来的是「后端副本数随便改、挂掉的实例自动从名册消失」
  # 单独一个服务：网关发版重启不会连带注册中心一起消失
  eureka:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-eureka:latest
    # 对外开放 8761：B 机上的 public 要注册进来、也要拉取名册
    # 名册页面会泄露内网 IP 结构，所以来源必须限定成 B 机 IP
    ports:
      - "8761:8761"
    healthcheck:
      # /eureka/apps 返回 200 就说明能正常应答查询
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8761/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ---------- 数据库迁移：一次性任务 ----------
  # 镜像跑完即退（Exited 0），不常驻、不占端口；public / admin 依赖它成功退出后才启动
  migration:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-migration:latest
    restart: "no"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- 公开服务 ----------
  public:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-public:latest
    # 不能写 container_name：副本必须由 compose 自动命名（blog-compose-public-1 / -2），
    # 写死了第二个副本会报 Conflict. The container name "..." is already in use
    # 副本数写在这里而不是靠命令行 --scale：
    # CI 的 up -d public 不带 --scale，会把副本数收敛回这里的值
    # 先 1 副本：2 核 4G 机器上 5 个 JVM 会贴着内存上限跑，同机多副本也不解决什么
    # 以后有多台机器或升配了再改回 2
    deploy:
      replicas: 1
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: root1234
      # 注册中心地址（容器内网络）
      EUREKA_URL: "http://eureka:8761/eureka"
      # 生产环境关闭接口文档，避免暴露 admin 的写接口
      SPRINGDOC_ENABLED: "false"
    healthcheck:
      # 探 actuator：HTTP 200 才算健康，含 db / redis 检查，代表「能接请求」而不只是「进程活着」
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8081/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      # 注册中心没起来就没有名册，后端地址无从查起
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- 管理服务 ----------
  admin:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-admin:latest
    # 迁移已移出，本服务不再持有 Flyway 锁，理论上可多副本；先保持 1
    deploy:
      replicas: 1
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: blog
      DB_PASSWORD: root1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: root1234
      # 注册中心地址（容器内网络）
      EUREKA_URL: "http://eureka:8761/eureka"
      # 生产环境关闭接口文档，避免暴露 admin 的写接口
      SPRINGDOC_ENABLED: "false"
    healthcheck:
      # 探 actuator：HTTP 200 才算健康，含 db / redis 检查，代表「能接请求」而不只是「进程活着」
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8082/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      # 注册中心没起来就没有名册，后端地址无从查起
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- 网关 ----------
  gateway:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-gateway:latest
    # 先 1 副本，理由同上；网关属于单点角色，等有多台机器时再做多副本
    deploy:
      replicas: 1
    environment:
      # 后端地址不再写死：网关按 lb://服务名 到这里查实例列表
      EUREKA_URL: "http://eureka:8761/eureka"
    healthcheck:
      # 网关没有 context-path，health 在根路径
      test: ["CMD", "wget", "-q", "-O-", "--timeout=3", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      # 注册中心没起来就没有名册，后端地址无从查起
      eureka:
        condition: service_healthy
      public:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: crpi-f7ypz0n6qfy16uva.cn-beijing.personal.cr.aliyuncs.com/ckaicraft/aimcc-blog-nginx:latest
    container_name: blog-nginx
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # 显式写死卷名：compose 默认会给卷名加「项目名_」前缀，而项目名取自目录名
  # （服务器上是 /opt/blog-compose → blog-compose）。哪天目录改名，前缀就变了，
  # compose 会挂到一个新建的空卷上，表现就是「数据库空了」。
  # 这里写成完整名字，从此和目录名解耦。
  blog-mysql-data:
    name: blog-compose_blog-mysql-data
