server:
  # 公开服务端口（管理服务是 8082）
  port: 8081
  servlet:
    # 所有接口统一挂在 /api 下，网关转发时路径可以原样透传
    context-path: /api

spring:
  application:
    name: blog-public-service
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://localhost:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
  # 公开服务不执行 Flyway：迁移只由管理服务负责，避免两个进程抢着建表

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
