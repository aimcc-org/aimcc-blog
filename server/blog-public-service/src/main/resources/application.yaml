server:
  # 公开服务端口（管理服务是 8082）
  port: 8081
  servlet:
    # 所有接口统一挂在 /api 下，网关转发时路径可以原样透传
    context-path: /api

spring:
  application:
    name: blog-public-service
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  datasource:
    # 默认值面向本地开发：直连本机 MySQL 3306
    # 容器内由 SPRING_DATASOURCE_URL 覆盖成 jdbc:mysql://mysql:3306/...
    url: jdbc:mysql://localhost:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
  # 公开服务不执行 Flyway：迁移只由管理服务负责，避免两个进程抢着建表

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health，实际地址 = context-path(/api) + /actuator/health
        # compose 的 healthcheck 靠它判断「能接请求了没有」
        include: health
  endpoint:
    health:
      # 只回 UP / DOWN，不把 db、redis 的细节暴露出去
      show-details: never

springdoc:
  api-docs:
    # 生产环境用 SPRINGDOC_ENABLED=false 关掉
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}


eureka:
  client:
    service-url:
      # 注册中心地址；容器里由 EUREKA_URL 注入服务名，本机跑 jar 默认 localhost
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # 用容器 IP 注册而不是主机名：容器主机名是随机 ID，别的容器未必解析得到
    prefer-ip-address: true
