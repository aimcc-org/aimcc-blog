server:
  # 管理服务端口（公开服务是 8081）
  port: 8082
  servlet:
    # 与公开服务保持同一个 context-path，网关只需要按路径前缀分流
    context-path: /api

spring:
  application:
    name: blog-admin-service
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  flyway:
    # 只有本服务执行数据库迁移
    enabled: true
    # 存量库：把已有表结构视为 V1 已完成，从 V2 开始执行
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    # 默认值面向本地开发：直连本机 MySQL 3306
    # 容器内由 SPRING_DATASOURCE_URL 覆盖成 jdbc:mysql://mysql:3306/...
    url: jdbc:mysql://localhost:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
