server:
  # 管理服务端口（公开服务是 8081）
  port: 8082
  servlet:
    # 与公开服务保持同一个 context-path，网关只需要按路径前缀分流
    context-path: /api

spring:
  application:
    name: blog-admin-service
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  datasource:
    # 默认值面向本地开发：直连本机 MySQL 3306
    # 容器内由 SPRING_DATASOURCE_URL 覆盖成 jdbc:mysql://mysql:3306/...
    url: jdbc:mysql://localhost:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health，实际地址 = context-path(/api) + /actuator/health
        # compose 的 healthcheck 靠它判断「能接请求了没有」
        include: health
  endpoint:
    health:
      # 只回 UP / DOWN，不把 db、redis 的细节暴露出去
      show-details: never

springdoc:
  api-docs:
    # 与 public 的 /api/v3/api-docs 区分开，否则网关只会把文档请求分给 public
    # 实际 URL = context-path(/api) + 这里的路径 = /api/admin/v3/api-docs
    path: /admin/v3/api-docs
    # 生产环境用 SPRINGDOC_ENABLED=false 关掉，避免把管理接口暴露出去
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    # UI 页面同样带上 admin 前缀；注意 UI 的静态资源仍在 /api/swagger-ui 下，
    # 走网关会被分给 public，所以 admin 的 UI 请直连端口访问：
    # http://localhost:8082/api/admin/swagger-ui.html
    path: /admin/swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}


eureka:
  client:
    service-url:
      # 注册中心地址；容器里由 EUREKA_URL 注入服务名，本机跑 jar 默认 localhost
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # 用容器 IP 注册而不是主机名：容器主机名是随机 ID，别的容器未必解析得到
    prefer-ip-address: true
