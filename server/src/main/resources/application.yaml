server:
  servlet:
    context-path: /api
spring:
  application:
    name: server
  datasource:
    url: jdbc:mysql://localhost:3306/aimcc_blog?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    # 密码通过环境变量 DB_PASSWORD 注入，不在文件中保存明文
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  # mapper XML 文件位置（联表等自定义 SQL 的住处）
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开发期打印 SQL，上线前删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
