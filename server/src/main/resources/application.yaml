server:
  servlet:
    context-path: /api
spring:
  application:
    name: server
  flyway:
    enabled: true
    # 首次接入 Flyway 的存量库：把已有表结构视为「V1 已完成」，从 V2 开始执行
    # （服务器/本地库都是先建的 profile、article，直接跑 V1 会重复插数据）
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    # 安全债②（2026-09-22）：移除 useSSL=false，走默认 SSL 协商——密码加密传输，
    # blog 账号已换回官方默认认证插件 caching_sha2_password
    url: jdbc:mysql://localhost:3306/aimcc_blog?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    # 密码通过环境变量 DB_PASSWORD 注入，不在文件中保存明文
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  # mapper XML 文件位置（联表等自定义 SQL 的住处）
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开发期打印 SQL，上线前删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
